<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00A86B" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <rect width="800" height="450" fill="url(#grid)" />

  <!-- Ambient Glow Circles -->
  <circle cx="650" cy="100" r="180" fill="#38BDF8" fill-opacity="0.08" filter="blur(40px)" />
  <circle cx="150" cy="350" r="200" fill="#3B82F6" fill-opacity="0.06" filter="blur(50px)" />

  <!-- Abstract Geometric Background Shapes -->
  <path d="M-100 450 L300 250 L500 450 Z" fill="url(#glowGrad)" />
  <path d="M400 0 L800 200 L800 0 Z" fill="#3B82F6" fill-opacity="0.05" />

  <!-- Glassmorphism Card in Center-Right -->
  <rect x="420" y="80" width="320" height="290" rx="20" fill="#1E293B" fill-opacity="0.4" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1.5" />
  <circle cx="460" cy="120" r="6" fill="#EF4444" fill-opacity="0.7" />
  <circle cx="480" cy="120" r="6" fill="#F59E0B" fill-opacity="0.7" />
  <circle cx="500" cy="120" r="6" fill="#10B981" fill-opacity="0.7" />
  <line x1="440" y1="140" x2="720" y2="140" stroke="#334155" stroke-width="1" />

  <!-- Thematic Icon / Graphic inside Card -->
  <g transform="translate(480, 170)" filter="url(#glow)">
    <rect x="40" y="60" width="120" height="60" rx="8" fill="#0369A1" fill-opacity="0.3" stroke="#38BDF8" stroke-width="4"/>
           <line x1="60" y1="30" x2="60" y2="60" stroke="#94A3B8" stroke-width="8"/>
           <line x1="100" y1="30" x2="100" y2="60" stroke="#94A3B8" stroke-width="8"/>
           <line x1="140" y1="30" x2="140" y2="60" stroke="#94A3B8" stroke-width="8"/>
           <path d="M50 90 Q 100 110 150 90" stroke="#00E599" stroke-width="4" fill="none"/>
  </g>

  <!-- Left Side Typography &amp; Brand -->
  <g transform="translate(60, 140)">
    <rect x="0" y="0" width="120" height="28" rx="14" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4" />
    <text x="60" y="18" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">CARBONTATVA AI</text>
    
    <text x="0" y="70" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5">Aluminium Smelting</text>
    <text x="0" y="105" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500">5.8% CCTS &amp; PFC Control</text>
    
    <!-- Decorative Progress Bar -->
    <rect x="0" y="140" width="280" height="6" rx="3" fill="#334155" />
    <rect x="0" y="140" width="180" height="6" rx="3" fill="url(#accentGrad)" />
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="446" width="800" height="4" fill="url(#accentGrad)" />
</svg>